name: Build and push foobar-api container image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "kubernetes/.argocd-source-*.yaml"
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: foobar-api
  REGISTRY_USER: ambrosiaaaaa
  REGISTRY: docker.io

jobs:
  test:
    runs-on: [my-runner-foobar]

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Go with explicit cache
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: foobar-api/go.sum

      # Check and run tests
      - name: Check and run tests
        working-directory: foobar-api
        run: |
          if [ ! -f go.mod ] || [ ! -f go.sum ]; then
            echo "Error: go.mod or go.sum not found!"
            exit 1
          fi
          TEST_FILES=$(find . -name "*_test.go")
          if [ -z "$TEST_FILES" ]; then
             echo "Warning: No test files found, skipping tests."
          else
            go test ./... -v
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.version.outputs.VERSION }}
      image-name: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Read version from file
        id: version
        run: |
          VERSION=$(cat foobar-api/.version)
          echo "Read version: $VERSION" # Debug
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT # Debug of the output file

      - name: Super Debug
        run: |
          echo "Conteúdo do arquivo VERSION:"
          cat foobar-api/.version
          echo "----------------"
          echo "Output do step anterior:"
          echo "${{ steps.version.outputs.VERSION }}"
          echo "----------------"
          echo "Tag completa que será usada:"
          echo "${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}"

      - name: Check if DOCKERHUB_TOKEN is set
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Erro: DOCKERHUB_TOKEN está vazio!"
            exit 1
          else
            echo "DOCKERHUB_TOKEN está definido."
          fi
      
      - name: Debug credentials
        run: |
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Username: ${{ env.REGISTRY_USER }}"
          echo "Token set: ${{ secrets.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./foobar-api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      # Checkout code for Trivy configuration
      - name: Checkout repository
        uses: actions/checkout@v3

      # Run Trivy security scan on the pushed Docker image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.image-name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      # Upload Trivy scan results to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Run Trivy scan with table format for PR comments and logs
      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.image-name }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Additional security scan job for pull requests (filesystem scan)
  security-scan-pr:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Run Trivy filesystem scan for pull requests
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './foobar-api'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      # Upload filesystem scan results to GitHub Security tab
      - name: Upload Trivy filesystem scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

      # Run filesystem scan with table format for logs
      - name: Run Trivy filesystem scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './foobar-api'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

